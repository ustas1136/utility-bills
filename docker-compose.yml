services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: utility_bills
    ports:
      - "15440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d utility_bills"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - ./backend/.env
    ports:
      - "18090:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: